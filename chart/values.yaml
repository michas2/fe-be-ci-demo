# Image coordinates are overridden by CI (--set) so the chart deploys the
# exact images built in that run. Defaults here are for manual use.
backend:
  image:
    repository: example-backend
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  port: 3000
  appVersion: helm

frontend:
  image:
    repository: example-frontend
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  port: 8080

# Kubernetes Gateway API (replaces the retired ingress-nginx path).
# The GatewayClass is provided by the cluster's Gateway controller
# (Envoy Gateway in CI). The chart creates a Gateway + HTTPRoute.
gateway:
  enabled: true
  className: eg
  hostname: example.local
