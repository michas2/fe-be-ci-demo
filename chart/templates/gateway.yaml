{{- if .Values.gateway.enabled }}
# Kubernetes Gateway API resources (replaces the Ingress).
# The GatewayClass "eg" is created out-of-band in CI and backed by the
# Envoy Gateway controller.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "example-app.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: {{ .Values.gateway.hostname | quote }}
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "example-app.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Release.Name }}
  hostnames:
    - {{ .Values.gateway.hostname | quote }}
  rules:
    # All traffic goes to the frontend; it proxies /api to the backend.
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ .Release.Name }}-frontend
          port: {{ .Values.frontend.port }}
{{- end }}
