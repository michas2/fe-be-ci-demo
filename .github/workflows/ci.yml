name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # Unit tests: fastest feedback, no containers needed.
  # ---------------------------------------------------------------------------
  unit:
    name: Backend unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install deps
        working-directory: backend
        run: npm ci
      - name: Run unit tests
        working-directory: backend
        run: npm test

  # ---------------------------------------------------------------------------
  # Fast tier: build images and bring the whole stack up with docker compose,
  # then run the integration test against the frontend (which proxies to the
  # backend). Catches "do the images work together" quickly.
  # ---------------------------------------------------------------------------
  compose-fast-tier:
    name: Integration (docker compose)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Build and start the stack
        # --wait blocks until the compose healthchecks pass (or fail),
        # so no manual polling loop is needed.
        run: docker compose up --build -d --wait

      - name: Run integration tests
        env:
          BASE_URL: http://localhost:18080
        run: node --test tests/integration.test.mjs

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down

  # ---------------------------------------------------------------------------
  # Fidelity tier: spin up a real (single-node) Kubernetes cluster with vind
  # (vCluster in Docker), install the Gateway API controller (Envoy Gateway),
  # build the images, deploy via Helm, then run the SAME integration test
  # through the Gateway's LoadBalancer. Catches Kubernetes-specific issues
  # (Service DNS, probes, Gateway routing, LoadBalancer) before real infra.
  #
  # Why vind over kind here:
  #   - LoadBalancer Services work out of the box, so the Gateway gets a real
  #     address and we test the actual LB -> Gateway data path (no port-forward).
  #   - No image load step: with the containerd image store enabled on the
  #     runner, vind's registry proxy serves locally-built images directly.
  # ---------------------------------------------------------------------------
  fidelity-tier:
    name: Integration (vind + Helm + Gateway API)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Enable the containerd image store
        # vind's registry proxy (which lets the cluster use purely local images
        # instead of pulling from a registry) only works when the host Docker
        # daemon uses the containerd image store. The ubuntu-latest runner
        # defaults to the legacy overlay2 store, so we switch it here. This must
        # happen BEFORE building images and before creating the cluster, since
        # restarting Docker clears running containers.
        run: |
          echo '{ "features": { "containerd-snapshotter": true } }' \
            | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          # Confirm the containerd snapshotter is active.
          docker info -f '{{ .DriverStatus }}'

      - name: Build images
        # No load step: with the containerd image store enabled, vind's registry
        # proxy serves these locally-built images directly to the cluster.
        run: |
          docker build -t example-backend:ci ./backend
          docker build -t example-frontend:ci ./frontend

      - name: Create vind cluster
        uses: loft-sh/setup-vind@v1

      - name: Install Envoy Gateway (Gateway API controller)
        run: |
          helm install eg oci://docker.io/envoyproxy/gateway-helm \
            --version v1.9.2 \
            -n envoy-gateway-system --create-namespace
          kubectl wait --timeout=300s -n envoy-gateway-system \
            deployment/envoy-gateway --for=condition=Available

      - name: Create GatewayClass
        run: |
          cat <<'EOF' | kubectl apply -f -
          apiVersion: gateway.networking.k8s.io/v1
          kind: GatewayClass
          metadata:
            name: eg
          spec:
            controllerName: gateway.envoyproxy.io/gatewayclass-controller
          EOF

      - name: Deploy with Helm
        run: |
          helm upgrade --install demo ./chart \
            --set backend.image.repository=example-backend \
            --set backend.image.tag=ci \
            --set backend.image.pullPolicy=IfNotPresent \
            --set frontend.image.repository=example-frontend \
            --set frontend.image.tag=ci \
            --set frontend.image.pullPolicy=IfNotPresent \
            --wait --timeout 180s

      - name: Wait for the Gateway to be programmed
        run: |
          # vind provides a LoadBalancer, so the Gateway reaches Programmed=True
          # with an assigned address (the Envoy service's external IP).
          kubectl wait --timeout=180s gateway/demo --for=condition=Programmed

      - name: Run integration tests through the Gateway LoadBalancer
        run: |
          # On Linux, Docker network IPs are routable from the host, so we reach
          # the LoadBalancer IP directly — no kubectl port-forward needed.
          GW_ADDR=$(kubectl get gateway/demo -o jsonpath='{.status.addresses[0].value}')
          echo "Gateway LoadBalancer address: $GW_ADDR"
          echo "$GW_ADDR example.local" | sudo tee -a /etc/hosts

          # The HAProxy LB container may need a few seconds to start answering
          # after the Gateway reports Programmed; poll before running the tests.
          for i in $(seq 1 30); do
            if curl -sf -H "Host: example.local" "http://$GW_ADDR/healthz" >/dev/null; then
              echo "LoadBalancer is reachable from the host"; break
            fi
            echo "waiting for LB to answer... ($i)"; sleep 2
          done

          BASE_URL=http://example.local node --test tests/integration.test.mjs

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          GW_ADDR=$(kubectl get gateway/demo -o jsonpath='{.status.addresses[0].value}' || true)
          echo "Gateway address: $GW_ADDR"
          echo "=== route to the LB subnet from the host ==="
          ip route get "$GW_ADDR" || true
          echo "=== direct curl attempt ==="
          curl -v -H "Host: example.local" "http://$GW_ADDR/healthz" || true
          echo "=== docker containers ==="
          docker ps -a --format 'table {{.Names}}\t{{.Status}}' | grep -Ei 'vcluster|haproxy' || true
          kubectl get pods -A
          kubectl get gateway,httproute,svc -A
          kubectl describe gateway demo || true
          kubectl logs -l app.kubernetes.io/component=backend --tail=50 || true
          kubectl logs -l app.kubernetes.io/component=frontend --tail=50 || true
