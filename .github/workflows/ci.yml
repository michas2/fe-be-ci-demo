name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # Unit tests: fastest feedback, no containers needed.
  # ---------------------------------------------------------------------------
  unit:
    name: Backend unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install deps
        working-directory: backend
        run: npm ci
      - name: Run unit tests
        working-directory: backend
        run: npm test

  # ---------------------------------------------------------------------------
  # Fast tier: build images and bring the whole stack up with docker compose,
  # then run the integration test against the frontend (which proxies to the
  # backend). Catches "do the images work together" quickly.
  # ---------------------------------------------------------------------------
  compose-fast-tier:
    name: Integration (docker compose)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build and start the stack
        run: docker compose up --build -d

      - name: Wait for the frontend to be healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:18080/healthz >/dev/null; then
              echo "frontend is up"; exit 0
            fi
            echo "waiting for frontend... ($i)"; sleep 2
          done
          echo "frontend did not become healthy"; docker compose logs; exit 1

      - name: Run integration tests
        env:
          BASE_URL: http://localhost:18080
        run: node --test tests/integration.test.mjs

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down

  # ---------------------------------------------------------------------------
  # Fidelity tier: spin up a real (single-node) Kubernetes cluster with kind,
  # install the ingress controller, build + load the images, deploy via Helm,
  # then run the SAME integration test through the Ingress. Catches
  # Kubernetes-specific issues (Service DNS, probes, Ingress) before real infra.
  # ---------------------------------------------------------------------------
  kind-fidelity-tier:
    name: Integration (kind + Helm)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ci

      - name: Build images
        run: |
          docker build -t example-backend:ci ./backend
          docker build -t example-frontend:ci ./frontend

      - name: Load images into kind
        run: |
          kind load docker-image example-backend:ci --name ci
          kind load docker-image example-frontend:ci --name ci

      - name: Install ingress-nginx
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.11.2/deploy/static/provider/kind/deploy.yaml
          kubectl wait --namespace ingress-nginx \
            --for=condition=ready pod \
            --selector=app.kubernetes.io/component=controller \
            --timeout=180s

      - name: Deploy with Helm
        run: |
          helm upgrade --install demo ./chart \
            --set backend.image.repository=example-backend \
            --set backend.image.tag=ci \
            --set backend.image.pullPolicy=Never \
            --set frontend.image.repository=example-frontend \
            --set frontend.image.tag=ci \
            --set frontend.image.pullPolicy=Never \
            --wait --timeout 180s

      - name: Show deployed resources
        run: kubectl get pods,svc,ingress

      - name: Port-forward the ingress controller
        run: |
          kubectl -n ingress-nginx port-forward svc/ingress-nginx-controller 8080:80 &
          sleep 5

      - name: Run integration tests through the Ingress
        env:
          # Host header must match the chart's ingress host.
          BASE_URL: http://example.local:8080
        run: |
          # Map example.local -> 127.0.0.1 so the Host header matches the Ingress rule.
          echo "127.0.0.1 example.local" | sudo tee -a /etc/hosts
          node --test tests/integration.test.mjs

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -A
          kubectl describe pods -l app.kubernetes.io/instance=demo
          kubectl logs -l app.kubernetes.io/component=backend --tail=50 || true
          kubectl logs -l app.kubernetes.io/component=frontend --tail=50 || true
