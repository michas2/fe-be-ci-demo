name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # Unit tests: fastest feedback, no containers needed.
  # ---------------------------------------------------------------------------
  unit:
    name: Backend unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install deps
        working-directory: backend
        run: npm ci
      - name: Run unit tests
        working-directory: backend
        run: npm test

  # ---------------------------------------------------------------------------
  # Fast tier: build images and bring the whole stack up with docker compose,
  # then run the integration test against the frontend (which proxies to the
  # backend). Catches "do the images work together" quickly.
  # ---------------------------------------------------------------------------
  compose-fast-tier:
    name: Integration (docker compose)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build and start the stack
        run: docker compose up --build -d

      - name: Wait for the frontend to be healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:18080/healthz >/dev/null; then
              echo "frontend is up"; exit 0
            fi
            echo "waiting for frontend... ($i)"; sleep 2
          done
          echo "frontend did not become healthy"; docker compose logs; exit 1

      - name: Run integration tests
        env:
          BASE_URL: http://localhost:18080
        run: node --test tests/integration.test.mjs

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down

  # ---------------------------------------------------------------------------
  # Fidelity tier: spin up a real (single-node) Kubernetes cluster with kind,
  # install the Gateway API controller (Envoy Gateway), build + load the images,
  # deploy via Helm, then run the SAME integration test through the Gateway.
  # Catches Kubernetes-specific issues (Service DNS, probes, Gateway routing)
  # before real infra. Uses the Kubernetes Gateway API, not the retired
  # ingress-nginx.
  # ---------------------------------------------------------------------------
  kind-fidelity-tier:
    name: Integration (kind + Helm + Gateway API)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ci

      - name: Build images
        run: |
          docker build -t example-backend:ci ./backend
          docker build -t example-frontend:ci ./frontend

      - name: Load images into kind
        run: |
          kind load docker-image example-backend:ci --name ci
          kind load docker-image example-frontend:ci --name ci

      - name: Install Envoy Gateway (Gateway API controller)
        run: |
          # Installs the Gateway API CRDs and the Envoy Gateway controller.
          helm install eg oci://docker.io/envoyproxy/gateway-helm \
            --version v1.4.6 \
            -n envoy-gateway-system --create-namespace
          kubectl wait --timeout=300s -n envoy-gateway-system \
            deployment/envoy-gateway --for=condition=Available

      - name: Create GatewayClass
        run: |
          cat <<'EOF' | kubectl apply -f -
          apiVersion: gateway.networking.k8s.io/v1
          kind: GatewayClass
          metadata:
            name: eg
          spec:
            controllerName: gateway.envoyproxy.io/gatewayclass-controller
          EOF

      - name: Deploy with Helm
        run: |
          helm upgrade --install demo ./chart \
            --set backend.image.repository=example-backend \
            --set backend.image.tag=ci \
            --set backend.image.pullPolicy=Never \
            --set frontend.image.repository=example-frontend \
            --set frontend.image.tag=ci \
            --set frontend.image.pullPolicy=Never \
            --wait --timeout 180s

      - name: Wait for the Gateway to be programmed
        run: |
          kubectl wait --timeout=180s gateway/demo \
            --for=condition=Programmed

      - name: Show deployed resources
        run: kubectl get pods,svc,gateway,httproute

      - name: Port-forward the Envoy service
        run: |
          # Envoy Gateway creates one Envoy Service per Gateway, labelled with
          # the owning gateway. Find it and port-forward to localhost:8080.
          ENVOY_SVC=$(kubectl get svc -n envoy-gateway-system \
            --selector=gateway.envoyproxy.io/owning-gateway-namespace=default,gateway.envoyproxy.io/owning-gateway-name=demo \
            -o jsonpath='{.items[0].metadata.name}')
          echo "Envoy service: $ENVOY_SVC"
          kubectl -n envoy-gateway-system port-forward "svc/${ENVOY_SVC}" 8080:80 &
          # Give the port-forward a moment to establish.
          sleep 8

      - name: Run integration tests through the Gateway
        env:
          # Host header must match the chart's gateway hostname.
          BASE_URL: http://example.local:8080
        run: |
          # Map example.local -> 127.0.0.1 so the Host header matches the route.
          echo "127.0.0.1 example.local" | sudo tee -a /etc/hosts
          node --test tests/integration.test.mjs

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -A
          kubectl get gateway,httproute -A
          kubectl describe gateway demo || true
          kubectl describe httproute demo || true
          kubectl describe pods -l app.kubernetes.io/instance=demo
          kubectl logs -l app.kubernetes.io/component=backend --tail=50 || true
          kubectl logs -l app.kubernetes.io/component=frontend --tail=50 || true
